name: Deploy Full Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Next.js dependencies
        working-directory: ./projects
        run: npm ci

      - name: Build Next.js app
        working-directory: ./projects
        run: npm run build

      - name: Create deployment directory
        run: mkdir -p _site

      - name: Copy static files to _site
        run: |
          # Copy root files
          cp index.html _site/
          cp CNAME _site/
          cp .nojekyll _site/

          # Copy resume folders
          cp -r resume _site/
          cp -r resume-mobile _site/

          # Copy Next.js build output to /projects/
          mkdir -p _site/projects
          cp -r projects/out/* _site/projects/

          # Copy project demos
          cp -r projects/gpu-parallax _site/projects/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
